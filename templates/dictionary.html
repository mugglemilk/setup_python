<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางแสดงคำศัพท์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #acc8d4;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-container {
            background-color: #f0c1d1;
            width: 95%; 
            max-width: 1400px;
            padding: 10px 45px; 
            box-sizing: border-box;
            border-radius: 40px; 
            margin: 25px 0;
            box-shadow: 0 5px 12px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 15px; 
        }

        .nav-btn {
            background-color: rgba(255, 255, 255, 0.5); 
            color: #333;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
        }

        .search-filter-container {
            width: 95%;
            max-width: 1400px; 
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: stretch;
        }

        .search-bar {
            flex-grow: 1;
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            outline: none;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sort-container {
            background-color: #f1d592;
            border-radius: 20px; 
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            min-width: 220px;
        }

        .sort-select {
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Sarabun', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            padding: 10px 5px;
            text-align: center;
        }

        .table-container {
            width: 95%;
            max-width: 1400px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        table { width: 100%; border-collapse: collapse; }
        
        th { 
            background-color: #d9d9d9; 
            padding: 18px; 
            border: 1px solid #ccc; 
            font-size: 1.1rem; 
            text-align: center; 
        }

        td { padding: 15px 20px; border: 1px solid #ccc; background-color: #e6e6e6; font-size: 1.1rem; }
        
        .col-word { width: 25%; text-align: center; font-weight: bold; }
        .col-synonyms { width: 75%; text-align: left; }
        
        .hidden-row { display: none; }
        
        .no-result-msg {
            text-align: center;
            color: #757575; 
            padding: 40px;
            font-size: 1.2rem;
            display: none; 
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="/dictionary" class="header-title">ตารางแสดงคำศัพท์</a>
        
        <div class="nav-buttons">
            <a href="/" class="nav-btn">หน้าหลัก</a>
            <a href="/editor" class="nav-btn">แต่งกลอนแปด</a>
        </div>
    </div>

    <div class="search-filter-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="ค้นหาคำศัพท์. . ." onkeyup="handleSearch(event)">
        
        <div class="sort-container">
            <select id="sortOrder" class="sort-select" onchange="renderTable()">
                <option value="asc">เรียงตามตัวอักษร ก - ฮ</option>
                <option value="desc">เรียงตามตัวอักษร ฮ - ก</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>คำศัพท์</th>
                    <th>คำไวพจน์ / คำพ้อง</th>
                </tr>
            </thead>
            <tbody id="word-table-body">

            </tbody>
        </table>
        <div id="noResult" class="no-result-msg">(ไม่พบข้อมูล)</div>
    </div>

   <script>
    function filterTable() {
        const input = document.getElementById("searchInput").value.trim();
        const tbody = document.getElementById("word-table-body");
        const noResult = document.getElementById("noResult");
        const sortOrder = document.getElementById('sortOrder').value; 
        const endpoint = input ? `/search?word=${encodeURIComponent(input)}` : '/all';

        fetch(endpoint)
            .then(response => response.json())
            .then(data => {
                tbody.innerHTML = '';
                let displayData = [];
                if (Array.isArray(data)) {
                    displayData = data;
                } else {
                    Object.keys(data).forEach(word => {
                        displayData.push({ word: word, syns: data[word] });
                    });
                }
                displayData.sort((a, b) => a.word.localeCompare(b.word, 'th'));
                if (sortOrder === 'desc') {
                    displayData.reverse();
                }
                if (displayData.length === 0) {
                    noResult.style.display = 'block';
                    return;
                }
                noResult.style.display = 'none';
                displayData.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="col-word">${item.word}</td>
                        <td class="col-synonyms">${item.syns}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:red; padding:40px;">ไม่สามารถโหลดข้อมูลได้</td></tr>';
            });
    }
    window.onload = filterTable;
    function handleSearch(event) {
        filterTable();
    }
    function renderTable() {
        filterTable();
    }
</script>
</body>
</html>
